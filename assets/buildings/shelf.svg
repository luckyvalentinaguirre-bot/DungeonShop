<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Estante de tienda visto desde arriba (con leve perspectiva). -->
  <!-- sombra -->
  <rect x="6" y="10" width="52" height="48" rx="4" fill="#000000" opacity="0.18"/>
  <!-- estructura de madera -->
  <rect x="5" y="6" width="54" height="50" rx="4" fill="#6b4423" stroke="#3a2412" stroke-width="2.5"/>
  <!-- interior (dos baldas) -->
  <rect x="10" y="11" width="44" height="18" rx="2" fill="#4a2f18"/>
  <rect x="10" y="33" width="44" height="18" rx="2" fill="#4a2f18"/>
  <!-- divisores -->
  <g fill="#7a5230">
    <rect x="30" y="11" width="4" height="18"/>
    <rect x="30" y="33" width="4" height="18"/>
  </g>
  <!-- borde superior iluminado (madera) -->
  <rect x="5" y="6" width="54" height="5" rx="3" fill="#8a5c34"/>
  <!-- vetas -->
  <g stroke="#5a3a1e" stroke-width="1" opacity="0.6">
    <line x1="8" y1="53" x2="56" y2="53"/>
  </g>
</svg>
